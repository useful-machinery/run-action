name: Resolve PR conflicts

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: resolve-conflicts-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  PR_NUMBER: ${{ github.event.issue.number }}

jobs:
  authorize:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/resolve-conflicts'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      pr: ${{ steps.inspect.outputs.pr }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check permission and capture the PR revision
        id: inspect
        run: node scripts/resolve-pr-conflicts.ts authorize
        env:
          GH_TOKEN: ${{ github.token }}

  resolve:
    needs: authorize
    if: needs.authorize.outputs.pr != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out automation and the PR separately
        uses: actions/checkout@v7
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.authorize.outputs.pr).head }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Codex
        run: npm install --global @openai/codex@0.153.4
      - name: Authenticate Codex
        run: printenv OPENAI_API_KEY | codex login --with-api-key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_HOME: ${{ runner.temp }}/codex
      - name: Prepare, resolve, and check the merge
        id: repair
        uses: useful-machinery/run-action@0572ca6153d1d030a1490d2f46298264aebd1cb3
        with:
          workflow: automation/.um/workflows/resolve-pr-conflicts.yaml
          source-root: automation/.um
          execution-root: pr
          export: resolution
          inputs: >-
            {"request":{"kind":"text","value":${{ toJSON(needs.authorize.outputs.pr) }}}}
        env:
          CODEX_HOME: ${{ runner.temp }}/codex
      - name: Hand off the Git bundle
        if: steps.repair.outputs.export-state == 'available'
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: resolution
          path: ${{ steps.repair.outputs.export-path }}
          overwrite: true
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [authorize, resolve]
    if: needs.resolve.outputs.artifact != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted publisher code, not the PR
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.resolve.outputs.artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/resolution
      - name: Publish to the unchanged PR branch
        run: node scripts/resolve-pr-conflicts.ts publish
        env:
          GH_TOKEN: ${{ secrets.PR_PUBLISH_TOKEN }}
          PR_SNAPSHOT: ${{ needs.authorize.outputs.pr }}
          RESOLUTION_DIRECTORY: ${{ runner.temp }}/resolution
