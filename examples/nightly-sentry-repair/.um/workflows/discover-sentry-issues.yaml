schemaVersion: 1

description: Discover at most ten unresolved Sentry issues from one bounded interval.

agentProfiles:
  discovery:
    harness:
      kind: pi
      config:
        model: openai/gpt-5.4-mini
        thinking: low

steps:
  discover:
    kind: agent
    agent:
      profile: discovery
      systemPrompt: ../prompts/discover-sentry-system.md
      message:
        text:
          - file: ../prompts/discover-sentry-request.md
    outputs:
      issueMatrix:
        kind: json
        from: agent_result
        schema: ../schemas/sentry-issue-matrix.schema.json

exports:
  issueMatrix:
    ref: outputs.discover.issueMatrix
