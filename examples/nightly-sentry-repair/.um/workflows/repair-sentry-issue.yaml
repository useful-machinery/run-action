schemaVersion: 1

description: Diagnose and repair one bounded issue in the caller-owned Git workspace.

inputs:
  request:
    kind: json

agentProfiles:
  repair:
    harness:
      kind: pi
      config:
        model: openai/gpt-5.4-mini
        thinking: high

steps:
  repair:
    kind: agent
    agent:
      profile: repair
      systemPrompt: ../prompts/repair-sentry-system.md
      message:
        text:
          - file: ../prompts/repair-sentry-request.md
        attachments:
          - ref: inputs.request
    outputs:
      changes:
        kind: git_branch
        from: workspace

exports:
  changes:
    ref: outputs.repair.changes
