name: Nightly Sentry repair

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      induce-publisher-failure:
        description: Exercise publisher failure isolation without changing the Scherzo result
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.discovery.outputs.export-value }}
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Node.js for the caller-selected harness
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
      - name: Install the caller-selected Pi harness
        run: npm install --global @earendil-works/pi-coding-agent@0.85.1
      - name: Discover a bounded Sentry issue matrix
        id: discovery
        uses: scherzo-systems/run-action@c4fc5925553593aa41fecf683e778b8e08fb8c73
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG_SLUG: ${{ vars.SENTRY_ORG_SLUG }}
          SENTRY_PROJECT_SLUG: ${{ vars.SENTRY_PROJECT_SLUG }}
        with:
          workflow: .um/workflows/discover-sentry-issues.yaml
          source-root: .um
          execution-root: .
          export: issueMatrix

  repair:
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Check out one clean caller workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure the caller-selected Git author
        run: |
          git config --local user.name "Scherzo repair automation"
          git config --local user.email "scherzo-repair@example.invalid"
      - name: Prepare Node.js for the caller-selected harness
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
      - name: Install the caller-selected Pi harness
        run: npm install --global @earendil-works/pi-coding-agent@0.85.1
      - name: Diagnose, repair, and retain one Git branch artifact
        id: repair
        uses: scherzo-systems/run-action@c4fc5925553593aa41fecf683e778b8e08fb8c73
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          workflow: .um/workflows/repair-sentry-issue.yaml
          source-root: .um
          execution-root: .
          inputs: >-
            {"request":{"kind":"json","value":${{ toJSON(matrix.issue) }}}}
          export: changes
      - name: Verify same-job result and retained Git carrier
        env:
          ARTIFACT_SET_PATH: ${{ steps.repair.outputs.artifact-set-path }}
          EXPORT_KIND: ${{ steps.repair.outputs.export-kind }}
          EXPORT_PATH: ${{ steps.repair.outputs.export-path }}
          EXPORT_STATE: ${{ steps.repair.outputs.export-state }}
          RESULT_PATH: ${{ steps.repair.outputs.result-path }}
          WORKFLOW_OUTCOME: ${{ steps.repair.outputs.outcome }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_OUTCOME" = succeeded
          test "$EXPORT_STATE" = available
          test "$EXPORT_KIND" = git_branch
          test -d "$ARTIFACT_SET_PATH"
          test -f "$RESULT_PATH"
          test -f "$EXPORT_PATH"
          scherzo-cloud artifact validate --json "$ARTIFACT_SET_PATH" >/dev/null
      - name: Prepare the private publisher handoff
        env:
          ARTIFACT_SET_PATH: ${{ steps.repair.outputs.artifact-set-path }}
          RESULT_PATH: ${{ steps.repair.outputs.result-path }}
        run: |
          set -euo pipefail
          artifact_set_identity() {
            python3 - "$1" <<'PY'
          import hashlib
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          digest = hashlib.sha256()
          for entry in sorted(path for path in root.rglob("*") if path.is_file()):
              digest.update(entry.relative_to(root).as_posix().encode("utf-8"))
              digest.update(b"\0")
              digest.update(entry.read_bytes())
          print(digest.hexdigest())
          PY
          }
          handoff="$RUNNER_TEMP/publisher-handoff"
          rm -rf "$handoff"
          mkdir -p "$handoff/artifact-set"
          cp -a "$ARTIFACT_SET_PATH/." "$handoff/artifact-set/"
          {
            printf 'result=%s\n' "$(sha256sum "$RESULT_PATH" | cut -d ' ' -f 1)"
            printf 'artifact-set=%s\n' "$(artifact_set_identity "$ARTIFACT_SET_PATH")"
          } >"$handoff/identities"
      - name: Retain the Artifact Set for the isolated publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentry-repair-${{ matrix.issue.id }}
          path: ${{ runner.temp }}/publisher-handoff
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  publish:
    needs: [discover, repair]
    if: ${{ needs.discover.outputs.matrix != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Check out the immutable caller publisher baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: publisher-source
          persist-credentials: false
      - name: Restore the private Artifact Set handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sentry-repair-${{ matrix.issue.id }}
          path: ${{ runner.temp }}/publisher-handoff
      - name: Verify the isolated publisher handoff
        id: before-publish
        env:
          ARTIFACT_SET_PATH: ${{ runner.temp }}/publisher-handoff/artifact-set
          IDENTITIES_PATH: ${{ runner.temp }}/publisher-handoff/identities
        run: |
          set -euo pipefail
          artifact_set_identity() {
            python3 - "$1" <<'PY'
          import hashlib
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          digest = hashlib.sha256()
          for entry in sorted(path for path in root.rglob("*") if path.is_file()):
              digest.update(entry.relative_to(root).as_posix().encode("utf-8"))
              digest.update(b"\0")
              digest.update(entry.read_bytes())
          print(digest.hexdigest())
          PY
          }
          expected_result="$(awk -F= '$1 == "result" { print $2 }' "$IDENTITIES_PATH")"
          expected_artifact_set="$(awk -F= '$1 == "artifact-set" { print $2 }' "$IDENTITIES_PATH")"
          observed_result="$(sha256sum "$ARTIFACT_SET_PATH/result.json" | cut -d ' ' -f 1)"
          observed_artifact_set="$(artifact_set_identity "$ARTIFACT_SET_PATH")"
          test "$observed_result" = "$expected_result"
          test "$observed_artifact_set" = "$expected_artifact_set"
          echo "result=$observed_result" >>"$GITHUB_OUTPUT"
          echo "artifact-set=$observed_artifact_set" >>"$GITHUB_OUTPUT"
      - name: Publish with separate caller credentials
        id: publisher
        continue-on-error: true
        env:
          ARTIFACT_SET_PATH: ${{ runner.temp }}/publisher-handoff/artifact-set
          GH_TOKEN: ${{ inputs.induce-publisher-failure && 'deliberately-invalid' || secrets.REPAIR_PUBLISHER_GITHUB_TOKEN }}
          INDUCE_PUBLISHER_FAILURE: ${{ inputs.induce-publisher-failure || 'false' }}
          SCHERZO_PUBLISHER_ATTESTATION_PATH: ${{ runner.temp }}/publisher-attempt.json
        run: |
          set -euo pipefail
          rm -f "$SCHERZO_PUBLISHER_ATTESTATION_PATH"
          if [[ "$INDUCE_PUBLISHER_FAILURE" == true ]]; then
            if ./publisher-source/scripts/publish-scherzo-branch \
              "$ARTIFACT_SET_PATH" changes; then
              echo "The publisher unexpectedly accepted invalid authority." >&2
              exit 1
            fi
            python3 - "$SCHERZO_PUBLISHER_ATTESTATION_PATH" <<'PY'
          import json
          import pathlib
          import sys

          expected = {
              "schemaVersion": 1,
              "provider": "github",
              "operation": "publish_git_branch",
              "requestAttempted": True,
              "outcome": "authorization_denied",
          }
          observed = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if observed != expected:
              raise SystemExit("publisher emitted an invalid provider-attempt attestation")
          PY
            exit 86
          fi
          ./publisher-source/scripts/publish-scherzo-branch \
            "$ARTIFACT_SET_PATH" changes
      - name: Verify publisher outcome and local result isolation
        if: ${{ always() && steps.before-publish.outcome == 'success' }}
        env:
          ARTIFACT_SET_PATH: ${{ runner.temp }}/publisher-handoff/artifact-set
          BEFORE_ARTIFACT_SET: ${{ steps.before-publish.outputs.artifact-set }}
          BEFORE_RESULT: ${{ steps.before-publish.outputs.result }}
          INDUCE_PUBLISHER_FAILURE: ${{ inputs.induce-publisher-failure || 'false' }}
          PUBLISHER_ATTESTATION_PATH: ${{ runner.temp }}/publisher-attempt.json
          PUBLISHER_OUTCOME: ${{ steps.publisher.outcome }}
        run: |
          set -euo pipefail
          artifact_set_identity() {
            python3 - "$1" <<'PY'
          import hashlib
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          digest = hashlib.sha256()
          for entry in sorted(path for path in root.rglob("*") if path.is_file()):
              digest.update(entry.relative_to(root).as_posix().encode("utf-8"))
              digest.update(b"\0")
              digest.update(entry.read_bytes())
          print(digest.hexdigest())
          PY
          }
          test "$(sha256sum "$ARTIFACT_SET_PATH/result.json" | cut -d ' ' -f 1)" = \
            "$BEFORE_RESULT"
          test "$(artifact_set_identity "$ARTIFACT_SET_PATH")" = \
            "$BEFORE_ARTIFACT_SET"
          if [[ "$INDUCE_PUBLISHER_FAILURE" == true ]]; then
            test "$PUBLISHER_OUTCOME" = failure
            python3 - "$PUBLISHER_ATTESTATION_PATH" <<'PY'
          import json
          import pathlib
          import sys

          expected = {
              "schemaVersion": 1,
              "provider": "github",
              "operation": "publish_git_branch",
              "requestAttempted": True,
              "outcome": "authorization_denied",
          }
          observed = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if observed != expected:
              raise SystemExit("publisher did not attest the expected provider rejection")
          PY
          else
            test "$PUBLISHER_OUTCOME" = success
            test ! -e "$PUBLISHER_ATTESTATION_PATH"
          fi
